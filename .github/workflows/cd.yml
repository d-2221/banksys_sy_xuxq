name: CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config <<EOF
          Host deploy-server
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
          EOF

      - name: Deploy via SSH
        run: |
          ssh deploy-server << 'DEPLOY_SCRIPT'
            set -e

            APP_NAME="banksys_sy_xuxq"
            DEPLOY_DIR="/opt/${APP_NAME}"
            PORT=8888
            PORT_MAX=8889

            echo ">> Creating deploy directory"
            mkdir -p "${DEPLOY_DIR}"

            echo ">> Building Docker image on server"
            cd "${DEPLOY_DIR}"
            docker build \
              --build-arg PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple \
              -t "${APP_NAME}:latest" .

            echo ">> Finding available port"
            port_in_use() {
              ss -ltnH 2>/dev/null | grep -q ":$1 " && return 0
              docker ps --format "{{.Ports}}" 2>/dev/null | grep -q ":$1->" && return 0
              return 1
            }
            AVAILABLE_PORT=""
            for p in $(seq "${PORT}" "${PORT_MAX}"); do
              if ! port_in_use "$p"; then
                AVAILABLE_PORT="$p"
                break
              fi
            done
            [ -z "$AVAILABLE_PORT" ] && { echo ">> 端口区间 ${PORT}-${PORT_MAX} 已全部占用, 部署中止"; exit 1; }
            echo ">> 部署到主机端口 ${AVAILABLE_PORT}"

            echo ">> Stopping and removing old container"
            docker rm -f "${APP_NAME}" 2>/dev/null || true

            echo ">> Starting new container"
            docker run -d \
              --name "${APP_NAME}" \
              --restart unless-stopped \
              -p "${AVAILABLE_PORT}:8888" \
              "${APP_NAME}:latest"

            echo ">> Waiting for health check"
            sleep 5
            curl -fsS "http://localhost:${AVAILABLE_PORT}/_stcore/health"
            echo ""
            echo ">> 部署成功: http://$(echo ${{ secrets.SSH_HOST }}):${AVAILABLE_PORT}/"
DEPLOY_SCRIPT

      - name: Report deployment status
        run: echo "✅ CD 部署完成 - 请检查健康检查结果"