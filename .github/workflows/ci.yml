name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Format check
        run: ruff format --check .

      - name: Lint check
        run: ruff check .

      - name: Test with coverage
        run: |
          # Generate test data for tests
          mkdir -p data
          python -c "
          import pandas as pd
          import numpy as np
          np.random.seed(42)
          n=50
          cols=['id','age','job','marital','education','default','housing','loan',
                'contact','month','day_of_week','duration','campaign','pdays',
                'previous','poutcome','emp_var_rate','cons_price_index',
                'cons_conf_index','lending_rate3m','nr_employed','subscribe']
          data=[[i,np.random.randint(20,70),'admin.','married','high.school',
                 'no','yes','no','cellular','may','mon',np.random.randint(50,5000),
                 np.random.randint(1,50),np.random.randint(0,1000),np.random.randint(0,10),
                 'nonexistent',np.random.uniform(-3,3),np.random.uniform(92,98),
                 np.random.uniform(-50,-30),np.random.uniform(0,6),
                 np.random.uniform(4900,5300),np.random.choice(['no','yes'])]
               for i in range(n)]
          pd.DataFrame(data,columns=cols).to_csv('data/train.csv',index=False)
          pd.DataFrame(data,columns=cols).to_csv('data/test.csv',index=False)
          print('Test data generated')
          "
          # Add project root to Python path for local package imports
          PYTHONPATH=. pytest --cov=app.data --cov=app.analysis --cov=app.model --cov-report=term-missing --cov-fail-under=80 -v

      - name: Generate test data for build

      - name: Generate test data for build
        run: |
          mkdir -p data
          python -c "
          import pandas as pd
          import numpy as np
          np.random.seed(42)
          n=50
          cols=['id','age','job','marital','education','default','housing','loan',
                'contact','month','day_of_week','duration','campaign','pdays',
                'previous','poutcome','emp_var_rate','cons_price_index',
                'cons_conf_index','lending_rate3m','nr_employed','subscribe']
          data=[[i,np.random.randint(20,70),'admin.','married','high.school',
                 'no','yes','no','cellular','may','mon',np.random.randint(50,5000),
                 np.random.randint(1,50),np.random.randint(0,1000),np.random.randint(0,10),
                 'nonexistent',np.random.uniform(-3,3),np.random.uniform(92,98),
                 np.random.uniform(-50,-30),np.random.uniform(0,6),
                 np.random.uniform(4900,5300),np.random.choice(['no','yes'])]
               for i in range(n)]
          pd.DataFrame(data,columns=cols).to_csv('data/train.csv',index=False)
          pd.DataFrame(data,columns=cols).to_csv('data/test.csv',index=False)
          print('Test data generated')
          "

  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t banksys_sy_xuxq:ci --build-arg PIP_INDEX_URL=https://pypi.org/simple .
          echo "Docker build successful"