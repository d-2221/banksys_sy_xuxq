name: Deploy App

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy code to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: "/opt/banksys_sy_xuxq"
          strip_components: 0
          rm: true

      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            APP="banksys_sy_xuxq"
            DIR="/opt/${APP}"
            PORT=8888
            cd "${DIR}"
            echo ">> Building Docker image..."
            docker build --build-arg PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple -t "${APP}:latest" .
            echo ">> Starting container..."
            docker rm -f "${APP}" 2>/dev/null || true
            docker run -d --name "${APP}" --restart unless-stopped -p "${PORT}:8888" "${APP}:latest"
            sleep 5
            echo ">> Health check:"
            curl -fsS "http://localhost:${PORT}/_stcore/health" && echo " OK" || echo " FAILED"
            echo ">> Done: http://${{ secrets.SSH_HOST }}:${PORT}/"